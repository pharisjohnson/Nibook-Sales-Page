services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: "8080"
      # InsForge credentials — set these in your .env file
      INSFORGE_URL: ${VITE_INSFORGE_URL}
      INSFORGE_SERVICE_KEY: ${VITE_INSFORGE_ANON_KEY}
      VITE_INSFORGE_URL: ${VITE_INSFORGE_URL}
      VITE_INSFORGE_ANON_KEY: ${VITE_INSFORGE_ANON_KEY}
      # Database (used by Drizzle ORM if direct DB access is needed)
      DATABASE_URL: ${DATABASE_URL:-}
      # Paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      APP_URL: ${APP_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_INSFORGE_URL: ${VITE_INSFORGE_URL}
        VITE_INSFORGE_ANON_KEY: ${VITE_INSFORGE_ANON_KEY}
        VITE_PAYSTACK_STARTER_PLAN_CODE: ${VITE_PAYSTACK_STARTER_PLAN_CODE:-}
        VITE_PAYSTACK_PREMIUM_PLAN_CODE: ${VITE_PAYSTACK_PREMIUM_PLAN_CODE:-}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
