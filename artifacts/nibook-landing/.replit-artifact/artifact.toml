kind = "web"
previewPath = "/"
title = "Nibook Sales Page"
version = "1.0.0"
id = "artifacts/nibook-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22183

[services.development]
run = "pnpm --filter @workspace/nibook-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nibook-landing", "run", "build" ]
publicDir = "artifacts/nibook-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22183"
BASE_PATH = "/"
